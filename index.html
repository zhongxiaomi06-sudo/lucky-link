<!doctype html>
<html lang="en-US" translate="no" data-entry="hero">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f4f0e8">
    <meta name="description" content="Play Lucky Link to unlock an ice-blue phone chain and a coupon blind box.">
    <title>Lucky Link · Ice Blue Lucky Drop</title>
  </head>
  <body>
    <main class="app-shell">
      <button class="sound-toggle" data-action="sound" type="button" aria-label="Mute soundtrack" aria-pressed="false"><span aria-hidden="true">◖))</span></button>

      <section class="view cover-view is-active" data-view="cover" aria-labelledby="cover-title">
        <div class="cover-scene" data-cover-scene>
          <img class="cover-art" data-fallback-src="/assets/cover-approved-v3-2_5d.png" alt="A silver phone and a crystal phone chain suspended inside a six-level summer craft diorama">
          <div class="depth-cuboids" aria-hidden="true">
            <i class="depth-cuboid cuboid-one"></i><i class="depth-cuboid cuboid-two"></i><i class="depth-cuboid cuboid-three"></i>
            <i class="depth-cuboid cuboid-four"></i><i class="depth-cuboid cuboid-five"></i><i class="depth-cuboid cuboid-six"></i>
          </div>
          <div class="cover-bokeh" aria-hidden="true"></div>
        </div>
        <div class="cover-scrim" aria-hidden="true"></div>
        <header class="cover-brand"><h1 id="cover-title">Lucky Link</h1></header>
        <form class="cover-action-wrap" action="/3d-lab.html">
          <button class="primary-action cover-action" data-action="start" type="submit"><span>Start</span><span aria-hidden="true">→</span></button>
        </form>
      </section>

      <section class="view compose-view" data-view="compose" aria-labelledby="compose-title" hidden>
        <header class="topbar compose-topbar">
          <button class="icon-button" data-action="back-cover" type="button" aria-label="Back to cover">‹</button>
          <div class="step-title"><p>Lucky Link</p><h2 id="compose-title">Make it yours</h2></div>
          <button class="text-button" data-action="clear" type="button">Clear</button>
        </header>

        <div class="workbench">
          <div class="wind-streak wind-streak-a" aria-hidden="true"></div><div class="wind-streak wind-streak-b" aria-hidden="true"></div>
          <div class="chain-stage" data-drop-zone aria-label="Your phone chain. Drop a material here.">
            <div class="chain-hook" aria-hidden="true"><span></span></div>
            <svg class="cord" viewBox="0 0 320 330" aria-hidden="true" preserveAspectRatio="none"><path d="M160 6 C42 34 34 238 160 304 C286 238 278 34 160 6"></path></svg>
            <div class="placed-beads" data-placed-beads></div>
            <div class="empty-hint" data-empty-hint><span class="hint-spark" aria-hidden="true">✦</span><strong>Tap a piece</strong><small>or drag it onto the chain</small></div>
            <output class="piece-count" data-piece-count>0 / 14</output>
          </div>
        </div>

        <div class="maker-dock">
          <div class="maker-actions">
            <button class="soft-button" data-action="undo" type="button" disabled><span aria-hidden="true">↶</span> Undo</button>
            <p class="maker-status" data-maker-status role="status" aria-live="polite">Choose at least 3 pieces</p>
            <button class="primary-action try-button" data-action="finish" type="button" disabled>Try it on <span aria-hidden="true">→</span></button>
          </div>
          <div class="material-filters" data-material-filters aria-label="Material categories"></div>
          <div class="materials" data-materials aria-label="Materials"></div>
        </div>
      </section>

      <section class="view preview-view" data-view="preview" aria-labelledby="preview-title" hidden>
        <img class="preview-art" loading="lazy" src="/assets/phone-plate-v1.png" alt="A silver phone in a sunlit summer veranda">
        <div class="preview-wash" aria-hidden="true"></div>
        <header class="topbar preview-topbar">
          <button class="icon-button light-control" data-action="edit" type="button" aria-label="Edit phone chain">‹</button>
          <div class="step-title light-title"><p>Your lucky</p><h2 id="preview-title">Made by you</h2></div>
          <span class="topbar-spacer" aria-hidden="true"></span>
        </header>
        <div class="preview-chain" aria-label="Your finished phone chain">
          <svg class="cord preview-cord" viewBox="0 0 300 360" aria-hidden="true" preserveAspectRatio="none"><path d="M150 4 C40 42 32 260 150 334 C268 260 260 42 150 4"></path></svg>
          <div class="preview-beads" data-preview-beads></div>
        </div>
        <div class="completion-card" role="status">
          <p>One of one</p>
          <div class="completion-actions"><button class="soft-button glass-button" data-action="edit" type="button">Edit</button><button class="primary-action" data-action="restart" type="button">Make another</button></div>
        </div>
      </section>

      <div class="drag-ghost" data-drag-ghost aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/home-entry.js"></script>
  </body>
</html>
